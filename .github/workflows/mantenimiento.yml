# Los lunes compila y prueba contra dibu main, para detectar cuanto antes cambios del motor
# que rompan el paquete.
name: Mantenimiento

on:
  schedule:
    - cron: "47 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibilidad:
    name: Compatibilidad con dibu main
    uses: ./.github/workflows/construir.yml
    with:
      dibu_ref: main
